  <text x="60" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="9" font-weight="700" fill="#b0d4f6" text-anchor="middle" letter-spacing="1.5">AIRWAYS</text>
