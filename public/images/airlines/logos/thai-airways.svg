  </g>
  <!-- Thai Airways text -->
  <text x="60" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">THAI</text>
  <text x="60" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#f0b6d2" text-anchor="middle" letter-spacing="1.5">AIRWAYS</text>
