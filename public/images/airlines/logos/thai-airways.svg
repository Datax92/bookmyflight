<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <rect width="120" height="120" rx="20" fill="#4e2a84"/>
  <circle cx="60" cy="50" r="32" fill="#3c1e68"/>
  <!-- Thai Silk orchid bloom curves -->
  <g transform="translate(60, 48)">
    <!-- Gold leaf -->
    <path d="M -22 8 C -14 -16 6 -24 24 -16 C 14 -8 -2 -4 -10 12 Z" fill="#e5a823"/>
